name: Provider command receipts
on:
  pull_request:
    paths:
      - 'backend/src/main/java/com/agentos/providerreceipts/**'
      - 'backend/src/test/java/com/agentos/providerreceipts/**'
      - 'backend/src/main/resources/db/migration/V023__provider_command_receipts.sql'
      - 'backend/src/main/resources/db/migration/V029__provider_access_check_queue.sql'
      - 'backend/src/main/resources/db/migration/V030__provider_access_check_receipts.sql'
      - 'backend/src/main/resources/db/migration/V031__provider_access_check_events.sql'
      - '.github/workflows/provider-command-receipts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentos_test
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos_ci_only
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Google Java import rules
        run: python3 scripts/check-java-imports.py
      - name: Verify H2 and native PostgreSQL receipts
        env:
          TASK_EDIT_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:15432/agentos_test
          TASK_EDIT_TEST_DB_USER: agentos
          TASK_EDIT_TEST_DB_PASSWORD: agentos_ci_only
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml '-Dtest=CredentialBoundaryTest,CommandBoundaryTest,ProviderReceipt*Test,ProviderReceiptPostgresIT' verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-command-receipts-evidence
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
