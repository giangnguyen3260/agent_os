name: Provider credential boundary
on:
  pull_request:
    paths:
      - 'backend/src/main/java/com/agentos/providercredentials/**'
      - 'backend/src/test/java/com/agentos/providercredentials/**'
      - '.github/workflows/provider-credential-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Google Java import rules
        run: python3 scripts/check-java-imports.py
      - name: Compile and test credential boundary with project Java 21
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml -Dtest=CredentialBoundaryTest test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-credential-boundary-evidence
          path: backend/target/surefire-reports
