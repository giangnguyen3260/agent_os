name: Code quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentos_test
          POSTGRES_USER: agentos
          # Disposable test service only; never application or production credentials.
          POSTGRES_PASSWORD: agentos_ci_only
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Google Java import rules
        run: python3 scripts/check-java-imports.py
      - name: Backend formatting, tests and coverage
        env:
          TEAM_SETTINGS_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:15432/agentos_test
          TEAM_SETTINGS_TEST_DB_USER: agentos
          TEAM_SETTINGS_TEST_DB_PASSWORD: agentos_ci_only
          TASK_EDIT_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:15432/agentos_test
          TASK_EDIT_TEST_DB_USER: agentos
          TASK_EDIT_TEST_DB_PASSWORD: agentos_ci_only
        # Default tests plus the explicit real-PostgreSQL suite, no silent skips.
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml '-Dtest=*Test,TeamSettingsPostgresIT,TaskDraftEditPostgresIT,MissionIntakePostgresIT,MissionIntakeHistoryPostgresIT,TaskOwnerPostgresIT,TaskOwnerHistoryPostgresIT' verify
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend dependency security audit
        working-directory: frontend
        run: npm run audit:check
      - name: Frontend Google style and type/build checks
        working-directory: frontend
        run: npm run lint && npm run format:check && npm run test:tooling && node scripts/test-auth-generation.cjs && node scripts/test-member-access-validation.cjs && node scripts/test-approval-grant-management-validation.cjs && node scripts/test-member-role-management-validation.cjs && node scripts/test-member-invitations-validation.cjs && node scripts/test-team-settings-validation.cjs && node scripts/test-organization-map-validation.cjs && node scripts/test-agent-permissions-validation.cjs && node scripts/test-trace-validation.cjs && node scripts/test-task-edit-validation.cjs && node scripts/test-task-owner-validation.cjs && node scripts/test-task-owner-history-validation.cjs && npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
            frontend/dist
      # SonarQube scanning is temporarily paused until a service is configured.
