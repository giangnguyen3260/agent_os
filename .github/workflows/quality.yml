name: Code quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentos_test
          POSTGRES_USER: agentos
          # Disposable test service only; never application or production credentials.
          POSTGRES_PASSWORD: agentos_ci_only
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Operator CLI fixed-output and uncertainty checks
        run: python3 -B scripts/test-provider-policy-admin.py
      - name: Google Java import rules
        run: python3 scripts/check-java-imports.py
      - name: Generate masked disposable publisher LOGIN credentials
        run: |
          python3 - <<'PYSECRETS'
          import os
          import secrets
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              for actor in ('ADMIN', 'HEALTH', 'PREPARE', 'UNREGISTERED', 'WEB', 'READER', 'RECREATED'):
                  value = secrets.token_urlsafe(48)
                  print('::add-mask::' + value)
                  target.write('PROVIDER_PUBLICATION_' + actor + '_PASSWORD=' + value + '\n')
          PYSECRETS
      - name: Start isolated publisher database with private logging
        shell: bash
        run: |
          set +x
          export POSTGRES_PASSWORD="$PROVIDER_PUBLICATION_ADMIN_PASSWORD"
          docker run --detach --name publication-quality-postgres \
            -p 127.0.0.1:15433:5432 \
            -e POSTGRES_PASSWORD -e POSTGRES_USER=publication_operator \
            -e POSTGRES_DB=publication_test -e POSTGRES_HOST_AUTH_METHOD=scram-sha-256 \
            postgres:16-alpine \
            -c log_statement=none -c log_min_error_statement=panic \
            -c log_error_verbosity=terse -c log_parameter_max_length=0 \
            -c log_parameter_max_length_on_error=0
          for attempt in {1..60}; do
            if docker exec publication-quality-postgres pg_isready -h 127.0.0.1 -U publication_operator -d publication_test >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo 'Disposable publisher database readiness failed'
          exit 1
      - name: Backend formatting, tests and coverage
        env:
          TEAM_SETTINGS_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:15432/agentos_test
          TEAM_SETTINGS_TEST_DB_USER: agentos
          TEAM_SETTINGS_TEST_DB_PASSWORD: agentos_ci_only
          TASK_EDIT_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:15432/agentos_test
          TASK_EDIT_TEST_DB_USER: agentos
          TASK_EDIT_TEST_DB_PASSWORD: agentos_ci_only
          PROVIDER_EVIDENCE_ALLOW_ROLE_TESTS: 'true'
          PROVIDER_PUBLICATION_ALLOW_ROLE_TESTS: 'true'
          PROVIDER_PUBLICATION_ADMIN_JDBC_URL: jdbc:postgresql://127.0.0.1:15433/publication_test
          PROVIDER_PUBLICATION_ADMIN_USER: publication_operator
        # Default tests plus the explicit real-PostgreSQL suite, no silent skips.
        # Bound retained contexts so evicted Hikari pools close before native suites.
        # Per-context pool capacity and all test selections remain unchanged.
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml -Dspring.test.context.cache.maxSize=4 '-Dtest=*Test,TeamSettingsPostgresIT,TaskDraftEditPostgresIT,MissionIntakePostgresIT,MissionIntakeHistoryPostgresIT,TaskOwnerPostgresIT,TaskOwnerHistoryPostgresIT,TaskDependenciesPostgresIT,TaskDependencyHistoryPostgresIT,ProviderConnectionPostgresIT,ProviderReceiptPostgresIT,ProviderCompletionPostgresIT,ProviderPolicyPostgresIT,ProviderOptionsPostgresIT,ProviderEvidencePostgresIT,ProviderPublicationPostgresIT' verify
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend dependency security audit
        working-directory: frontend
        run: npm run audit:check
      - name: Frontend Google style and type/build checks
        working-directory: frontend
        run: npm run lint && npm run format:check && npm run test:tooling && node scripts/test-auth-generation.cjs && node scripts/test-member-access-validation.cjs && node scripts/test-approval-grant-management-validation.cjs && node scripts/test-member-role-management-validation.cjs && node scripts/test-member-invitations-validation.cjs && node scripts/test-team-settings-validation.cjs && node scripts/test-organization-map-validation.cjs && node scripts/test-agent-permissions-validation.cjs && node scripts/test-trace-validation.cjs && node scripts/test-task-edit-validation.cjs && node scripts/test-task-owner-validation.cjs && node scripts/test-task-owner-history-validation.cjs && node scripts/test-task-dependencies-validation.cjs && node scripts/test-task-dependency-history-validation.cjs && npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
            frontend/dist
      - name: Destroy isolated publisher database
        if: always()
        run: docker rm --force publication-quality-postgres >/dev/null 2>&1 || true
      # SonarQube scanning is temporarily paused until a service is configured.
