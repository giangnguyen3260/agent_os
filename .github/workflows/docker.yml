name: Docker build and smoke test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create ephemeral local database secret
        run: |
          python3 - <<'PY'
          import secrets
          import os
          from pathlib import Path
          password = secrets.token_urlsafe(24)
          print('::add-mask::' + password)
          with Path('.env').open('w') as config:
              print('POSTGRES_PASSWORD=' + secrets.token_hex(32), file=config)
              print('APP_PORT=18080', file=config)
              print('MAILPIT_PORT=18025', file=config)
              print('AGENTOS_RECOVERY_FRONTEND_BASE_URL=http://127.0.0.1:18080', file=config)
              print('AGENTOS_BOOTSTRAP_ENABLED=true', file=config)
              print('AGENTOS_BOOTSTRAP_EMAIL=qc@example.test', file=config)
              print('AGENTOS_BOOTSTRAP_DISPLAY_NAME=QC Operator', file=config)
              print('AGENTOS_BOOTSTRAP_PASSWORD=' + password, file=config)
          with Path(os.environ['GITHUB_ENV']).open('a') as env:
              print('E2E_EMAIL=qc@example.test', file=env)
              print('E2E_PASSWORD=' + password, file=env)
          PY
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start healthy stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify frontend, SPA, API and private management path
        run: |
          curl --fail --silent http://127.0.0.1:18080/healthz
          curl --fail --silent http://127.0.0.1:18080/missions | grep -q '<app-root'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/v1/organizations)
          test "$status" = 401
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/actuator/health)
          test "$status" = 404
      - name: Verify migrated identity and session schema
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT version, success FROM flyway_schema_history ORDER BY installed_rank;"'
      # Separate disposable humans keep password reset tests from changing the login fixture.
      - name: Provision isolated recovery test accounts
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          INSERT INTO human_accounts(id,email,display_name,password_hash)
          SELECT gen_random_uuid(), 'recovery-' || surface || '@example.test', 'Recovery QC', password_hash
          FROM human_accounts CROSS JOIN (VALUES ('desktop'), ('tablet'), ('mobile'), ('race')) AS surfaces(surface)
          WHERE email = 'qc@example.test';
          SQL
      - name: Provision isolated workspace memberships
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          INSERT INTO human_accounts(id,email,display_name,password_hash)
          SELECT gen_random_uuid(), 'workspace-qc@example.test', 'Workspace QC', password_hash
          FROM human_accounts WHERE email = 'qc@example.test';
          INSERT INTO organizations(id,name,slug,status,created_at,updated_at) VALUES
          ('11111111-1111-4111-8111-111111111111','QC Workspace Alpha','qc-workspace-alpha','ACTIVE',now(),now()),
          ('22222222-2222-4222-8222-222222222222','QC Workspace Beta','qc-workspace-beta','ACTIVE',now(),now());
          INSERT INTO organization_memberships(account_id,organization_id,role)
          SELECT id, '11111111-1111-4111-8111-111111111111', 'MEMBER'
          FROM human_accounts WHERE email = 'workspace-qc@example.test';
          SQL
      - name: Provision isolated dashboard tasks
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < scripts/dashboard-ci-fixture.sql
      - name: Provision isolated team creation fixtures
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < scripts/team-create-ci-fixture.sql
      - name: Provision isolated Agent Studio fixtures
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < scripts/agent-studio-ci-fixture.sql
      - name: Provision isolated activation review fixtures
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < scripts/agent-activation-ci-fixture.sql
      - name: Provision isolated Agent directory fixtures
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < scripts/agent-directory-ci-fixture.sql
      - name: Provision isolated Team directory fixtures
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < scripts/team-directory-ci-fixture.sql
      - name: Provision isolated Team workspace fixtures
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < scripts/team-workspace-ci-fixture.sql
      - name: Provision isolated Mission creation fixtures
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < scripts/mission-create-ci-fixture.sql
      - name: PostgreSQL Mission creation persistence and concurrent replay
        timeout-minutes: 3
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: python3 scripts/mission-create-probe.py
      - name: Provision Mission directory fixtures
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < scripts/mission-directory-ci-fixture.sql
      - name: PostgreSQL Mission directory projection and read boundary
        timeout-minutes: 2
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: python3 scripts/mission-directory-probe.py
      - name: Provision Mission workspace fixtures
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < scripts/mission-workspace-ci-fixture.sql
      - name: PostgreSQL Mission workspace scope and read boundary
        timeout-minutes: 2
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: python3 scripts/mission-workspace-probe.py
      - name: PostgreSQL Task detail scope and read boundary
        timeout-minutes: 2
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: python3 scripts/task-detail-probe.py
      - name: Provision Task creation fixtures
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < scripts/task-create-ci-fixture.sql
      - name: PostgreSQL Task creation persistence and concurrent replay
        timeout-minutes: 3
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: python3 scripts/task-create-probe.py
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Real backend browser login across three viewports
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
          E2E_MAILPIT_URL: http://127.0.0.1:18025
        run: npm run test:e2e
      - name: PostgreSQL concurrent Agent Draft creation and replay
        timeout-minutes: 2
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: python3 scripts/agent-create-race-probe.py
      - name: PostgreSQL Agent Studio optimistic concurrency and replay
        timeout-minutes: 2
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: python3 scripts/agent-studio-race-probe.py
      - name: PostgreSQL activation preflight no-mutation boundary
        timeout-minutes: 2
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: python3 scripts/agent-activation-probe.py
      - name: PostgreSQL directory projection and read boundary
        timeout-minutes: 2
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: python3 scripts/agent-directory-probe.py
      - name: PostgreSQL Team directory projection and read boundary
        timeout-minutes: 2
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: python3 scripts/team-directory-probe.py
      - name: PostgreSQL Team workspace read boundary
        timeout-minutes: 2
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: python3 scripts/team-workspace-probe.py
      - name: PostgreSQL barrier for concurrent login and password reset
        timeout-minutes: 2
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
          E2E_MAILPIT_URL: http://127.0.0.1:18025
        run: |
          # Bound database waits in this disposable CI stack, including application connections.
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          ALTER SYSTEM SET statement_timeout='15s';
          ALTER SYSTEM SET lock_timeout='10s';
          SELECT pg_reload_conf();
          SQL
          python3 scripts/recovery-race-probe.py
      - name: Session and account survive backend restart
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: |
          python3 scripts/auth-session-probe.py save
          docker compose restart backend
          docker compose up --detach --wait --wait-timeout 180
          python3 scripts/auth-session-probe.py resume
      - name: Container status
        if: always()
        run: docker compose ps --all
      - name: Stop disposable CI stack
        if: always()
        run: |
          python3 -c 'from pathlib import Path; Path("auth-session-probe.json").unlink(missing_ok=True)'
          docker compose down --volumes
