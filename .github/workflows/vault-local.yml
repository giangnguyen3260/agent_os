name: Local Vault integration
on:
  pull_request:
    paths:
      - backend/src/main/java/com/agentos/providervault/**
      - backend/src/test/java/com/agentos/providervault/**
      - backend/src/main/java/com/agentos/providercredentials/**
      - backend/src/main/java/com/agentos/providercommands/**
      - backend/src/main/java/com/agentos/providercompletion/**
      - backend/src/main/java/com/agentos/providerconnections/**
      - backend/src/main/java/com/agentos/providercreation/**
      - backend/src/main/java/com/agentos/provideradmission/**
      - backend/src/main/java/com/agentos/providerrename/**
      - backend/src/main/java/com/agentos/providerreceipts/**
      - backend/src/main/java/com/agentos/providertransport/ProviderCreateBody.java
      - backend/pom.xml
      - backend/src/main/java/com/agentos/providerpreparation/**
      - backend/src/main/resources/db/migration/**
      - compose.vault-ci.yaml
      - compose.vault.yaml
      - docker/vault/**
      - scripts/check-vault-local.sh
      - .github/workflows/vault-local.yml
      - frontend/src/app/features/provider-connections/**
      - frontend/tests/e2e/provider-create-live.spec.mjs
      - frontend/scripts/provider-vault-server.mjs
permissions:
  contents: read
jobs:
  vault:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare real provider browser acceptance
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Resolve fixed Vault release to immutable image
        run: |
          docker pull hashicorp/vault:2.1.2
          image=$(docker image inspect hashicorp/vault:2.1.2 --format '{{index .RepoDigests 0}}')
          echo "AGENTOS_VAULT_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Real disposable Vault integration
        run: bash scripts/check-vault-local.sh
