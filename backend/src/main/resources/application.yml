spring:
  application:
    name: agentos
  datasource:
    url: jdbc:postgresql://localhost:5432/agentos
    username: agentos
    password: agentos
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${AGENTOS_SMTP_USERNAME:}
    password: ${AGENTOS_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${AGENTOS_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${AGENTOS_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: ${AGENTOS_SMTP_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${AGENTOS_SMTP_READ_TIMEOUT:5000}
      mail.smtp.writetimeout: ${AGENTOS_SMTP_WRITE_TIMEOUT:5000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    timeout: ${AGENTOS_SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
  flyway:
    enabled: true

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${AGENTOS_SESSION_COOKIE_SECURE:true}

agentos:
  invitations:
    enabled: ${AGENTOS_INVITATIONS_ENABLED:false}
    frontend-base-url: ${AGENTOS_INVITATIONS_FRONTEND_BASE_URL:}
    from: ${AGENTOS_INVITATIONS_FROM:}
    # Dispatch delay 100..60000 ms; retry delay 1..3600 seconds.
    # Fixed policy: 72h lifetime, 60s resend cooldown, 5 SMTP attempts, one job per tick.
    dispatch-delay-ms: ${AGENTOS_INVITATIONS_DISPATCH_DELAY_MS:1000}
    retry-delay-seconds: ${AGENTOS_INVITATIONS_RETRY_DELAY_SECONDS:60}
  recovery:
    enabled: ${AGENTOS_RECOVERY_ENABLED:false}
    frontend-base-url: ${AGENTOS_RECOVERY_FRONTEND_BASE_URL:}
    from: ${AGENTOS_RECOVERY_FROM:}
    dispatch-delay-ms: ${AGENTOS_RECOVERY_DISPATCH_DELAY_MS:1000}
    retry-delay-seconds: ${AGENTOS_RECOVERY_RETRY_DELAY_SECONDS:60}
  orchestration:
    max-task-retries: 3
    max-planning-retries: 2
    max-discussion-rounds: 5
    max-delegation-depth: 4
  resource:
    default-mission-cost-limit: 5.00
    default-agent-daily-cost-limit: 20.00
  governance:
    approval-timeout-hours: 24
