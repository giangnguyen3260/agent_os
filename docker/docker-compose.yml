# Dependencies-only development setup; full application stack: ../compose.yaml
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentos}
      POSTGRES_USER: ${POSTGRES_USER:-agentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - agentos-postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
volumes:
  agentos-postgres-data:
