name: agentos
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentos}
      POSTGRES_USER: ${POSTGRES_USER:-agentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: agentos-backend:local
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agentos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agentos}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AGENTOS_BOOTSTRAP_ENABLED: ${AGENTOS_BOOTSTRAP_ENABLED:-false}
      AGENTOS_BOOTSTRAP_EMAIL: ${AGENTOS_BOOTSTRAP_EMAIL:-}
      AGENTOS_BOOTSTRAP_DISPLAY_NAME: ${AGENTOS_BOOTSTRAP_DISPLAY_NAME:-}
      AGENTOS_BOOTSTRAP_PASSWORD: ${AGENTOS_BOOTSTRAP_PASSWORD:-}
      AGENTOS_SESSION_COOKIE_SECURE: ${AGENTOS_SESSION_COOKIE_SECURE:-false}
      AGENTOS_RECOVERY_ENABLED: ${AGENTOS_RECOVERY_ENABLED:-true}
      AGENTOS_RECOVERY_FRONTEND_BASE_URL: ${AGENTOS_RECOVERY_FRONTEND_BASE_URL:-http://localhost:8080}
      AGENTOS_RECOVERY_FROM: ${AGENTOS_RECOVERY_FROM:-no-reply@agentos.local}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: '1025'
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 40s

  frontend:
    image: agentos-frontend:local
    build:
      context: ./frontend
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  # Development mailbox only; messages never relay to external email services.
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
    restart: unless-stopped

volumes:
  postgres-data:
